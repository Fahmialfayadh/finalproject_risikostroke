<div class="share-shell">
    <div class="subnav-row">
        <nav class="subnav" aria-label="Navigasi berbagi data">
            <a href="/share" class="subnav-link {{ 'is-active' if active_tab == 'access' else '' }}">Berbagi Akses</a>
            <a href="/share/documents" class="subnav-link {{ 'is-active' if active_tab == 'documents' else '' }}">Dokumen &amp; Gambar</a>
            <a href="/share/keys" class="subnav-link {{ 'is-active' if active_tab == 'keys' else '' }}">Kunci RSA (.pem)</a>
        </nav>

        {% if user is defined and user %}
            {% if user.public_key %}
            <a href="/share/keys" class="rsa-status rsa-status--active">RSA-2048 Aktif</a>
            {% else %}
            <a href="/share/keys" class="rsa-status rsa-status--missing">RSA Belum Aktif</a>
            {% endif %}
        {% endif %}
    </div>

    {% if msg %}
    <div class="alert alert--success" role="status">{{ msg }}</div>
    {% endif %}
    {% if err %}
    <div class="alert alert--error" role="alert">{{ err }}</div>
    {% endif %}
</div>
